<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Practice Room">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tommie's Practice Room</title>
<style>
/* Practice Room. The look follows the iOS conventions a phone player already knows: system type, large
   titles, grouped cards on a grey ground, a translucent tab bar, sheets that slide up. One tint (indigo)
   marks what can be tapped; green, amber and red only ever mean right, nearly and wrong. The stage, where
   the playing happens, is always dark. */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-2: #f2f2f7;
  --fill: rgba(118, 118, 128, .12);
  --fill-2: rgba(118, 118, 128, .2);
  --sep: rgba(60, 60, 67, .16);
  --ink: #000000;
  --ink-2: #3a3a3c;
  --ink-3: #636366;
  --tint: #5856d6;
  --tint-ink: #ffffff;
  --tint-text: #4a48c9;
  --tint-soft: rgba(88, 86, 214, .12);
  --good: #1f8a3b;
  --good-fill: #34c759;
  --good-soft: rgba(52, 199, 89, .16);
  --adjust: #a85a00;
  --adjust-fill: #ff9f0a;
  --adjust-soft: rgba(255, 159, 10, .18);
  --bad: #d70015;
  --bad-fill: #ff3b30;
  --bad-soft: rgba(255, 59, 48, .13);
  --gold: #ffb800;
  --flame: #ff6a00;
  --bar-bg: rgba(249, 249, 251, .82);
  --sheet: #f2f2f7; --sheet-card: #ffffff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .06);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --r: 16px;
  --tabs-h: 56px;
  /* names the scripts still use */
  --accent-text: var(--tint-text); --line: var(--sep); --panel: var(--card);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .36); --sep: rgba(84, 84, 88, .62);
    --ink: #ffffff; --ink-2: #d1d1d6; --ink-3: #98989f;
    --tint: #6b69f0; --tint-ink: #ffffff; --tint-text: #9d9bff; --tint-soft: rgba(125, 122, 255, .2);
    --good: #30d158; --good-fill: #30d158; --good-soft: rgba(48, 209, 88, .18);
    --adjust: #ffb340; --adjust-fill: #ff9f0a; --adjust-soft: rgba(255, 159, 10, .2);
    --bad: #ff6961; --bad-fill: #ff453a; --bad-soft: rgba(255, 69, 58, .2);
    --gold: #ffd60a; --flame: #ff9f0a;
    --bar-bg: rgba(22, 22, 24, .8); --sheet: #1c1c1e; --sheet-card: #2c2c2e;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --card-2: #2c2c2e; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .36); --sep: rgba(84, 84, 88, .62);
  --ink: #ffffff; --ink-2: #d1d1d6; --ink-3: #98989f;
  --tint: #6b69f0; --tint-ink: #ffffff; --tint-text: #9d9bff; --tint-soft: rgba(125, 122, 255, .2);
  --good: #30d158; --good-fill: #30d158; --good-soft: rgba(48, 209, 88, .18);
  --adjust: #ffb340; --adjust-fill: #ff9f0a; --adjust-soft: rgba(255, 159, 10, .2);
  --bad: #ff6961; --bad-fill: #ff453a; --bad-soft: rgba(255, 69, 58, .2);
  --gold: #ffd60a; --flame: #ff9f0a;
  --bar-bg: rgba(22, 22, 24, .8); --sheet: #1c1c1e; --sheet-card: #2c2c2e;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f); font-size: 16px; line-height: 1.4; letter-spacing: -.01em;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
a { color: var(--tint-text); }
:focus-visible { outline: 3px solid var(--tint-text); outline-offset: 2px; border-radius: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }
[hidden] { display: none !important; }

.app { max-width: 640px; margin-inline: auto; padding: calc(env(safe-area-inset-top, 0px) + 6px) 16px calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 28px); display: flex; flex-direction: column; gap: 6px; min-height: 100%; }
.app.is-practice { padding-bottom: 32px; }
#main { display: flex; flex-direction: column; gap: 22px; }

/* ---- the strip above every screen: where the data lives, and settings ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.sync { font-size: 12px; font-weight: 500; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.sync.is-cloud i { background: var(--good-fill); }
.sync.is-warn i { background: var(--adjust-fill); }
.sync.is-bad i { background: var(--bad-fill); }
button.sync { border: 0; background: none; padding: 0; margin: 0; min-height: 36px; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; background: var(--fill); border-radius: 50%; color: var(--tint-text); flex: none; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.plain { background: transparent; }

/* ---- type ---- */
.large-title { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.title { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.12; text-wrap: balance; }
.h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.h3 { font-size: 17px; font-weight: 600; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; line-height: 1.38; }
.mono { font-family: var(--f-mono); font-variant-ligatures: none; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.round { font-family: var(--f-round); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-tight { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-inline: 4px; }
.title-row { display: flex; align-items: flex-start; gap: 12px; }
.title-row .lvl { margin-top: 4px; }

/* ---- buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--fill); color: var(--tint-text); font-weight: 600; font-size: 17px; text-decoration: none; white-space: nowrap; transition: transform .12s ease, opacity .12s ease; }
.btn:active { transform: scale(.97); opacity: .85; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-primary { background: var(--tint); color: var(--tint-ink); }
.btn-tinted { background: var(--tint-soft); color: var(--tint-text); }
.btn-stop { background: var(--bad-soft); color: var(--bad); }
.btn-ghost { background: transparent; padding: 0 8px; min-height: 44px; }
.btn-sm { min-height: 34px; padding: 0 14px; font-size: 15px; border-radius: 17px; }
.btn-sm svg { width: 16px; height: 16px; }
.btn-block { width: 100%; }
.btn-play { min-height: 56px; font-size: 19px; border-radius: 16px; }
.link { color: var(--tint-text); font-weight: 500; background: none; border: 0; padding: 0; text-decoration: none; font-size: inherit; }
.back { margin-left: -8px; font-weight: 400; gap: 2px; }
.back svg { width: 22px; height: 22px; }

/* ---- small labels ---- */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--fill); color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; border: 0; text-decoration: none; }
.chip svg { width: 13px; height: 13px; }
button.chip { height: 34px; padding: 0 15px; border-radius: 17px; font-size: 15px; background: var(--card); color: var(--ink); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; background: var(--fill); color: var(--ink-3); }
.pill svg { width: 12px; height: 12px; }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-adjust { background: var(--adjust-soft); color: var(--adjust); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-accent { background: var(--tint-soft); color: var(--tint-text); }
.lvl { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: #fff; font-family: var(--f-round); font-weight: 700; font-size: 16px; flex: none; background: #8e8e93; }
.lvl[data-l="1"] { background: #34a853; } .lvl[data-l="2"] { background: #0a84d0; } .lvl[data-l="3"] { background: #5856d6; } .lvl[data-l="4"] { background: #c2478f; } .lvl[data-l="5"] { background: #d1453b; }

/* ---- cards and grouped lists ---- */
.card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.panel { background: var(--card); border-radius: var(--r); padding: 16px; }
.panel-flat { background: var(--fill); border-radius: var(--r); padding: 14px 16px; }
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; position: relative; text-align: left; background: none; border: 0; width: 100%; color: inherit; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.6); }
.item.has-icon + .item.has-icon::before { left: 58px; }
button.item:active { background: var(--fill); }
.item-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-title { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; line-height: 1.25; }
.item-sub { font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.item-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.item-val { font-family: var(--f-round); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.chev { width: 14px; height: 14px; color: var(--ink-3); opacity: .6; flex: none; }
.empty { color: var(--ink-3); font-size: 15px; padding: 4px; }
.note { border-left: 3px solid var(--tint); padding: 2px 0 2px 12px; color: var(--ink-2); font-size: 15px; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--tint-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: 15px; }
.notice > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--tint-text); }
.notice-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.notice-warn { background: var(--adjust-soft); }
.notice-warn > svg { color: var(--adjust); }
.notice-bad { background: var(--bad-soft); }
.notice-bad > svg { color: var(--bad); }
.logbox { font-size: 12px; line-height: 1.5; color: var(--ink-2); background: var(--fill); border-radius: 10px; padding: 10px 12px; max-height: 220px; overflow: auto; overflow-wrap: anywhere; }

/* ---- tab bar ---- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 640px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabs-h); }
.tab { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-3); font-weight: 500; font-size: 10px; letter-spacing: .01em; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--tint-text); }

/* ---- the home screen ---- */
.hero { background: linear-gradient(140deg, #4a3fd6 0%, #7a48e0 55%, #b04fd0 100%); color: #fff; border-radius: 24px; padding: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { position: relative; width: 104px; height: 104px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: rgba(255, 255, 255, .22); stroke-width: 11; }
.ring .arc { fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-mid b { font-family: var(--f-round); font-size: 28px; font-weight: 700; }
.ring-mid span { font-size: 11px; font-weight: 600; opacity: .85; margin-top: 3px; }
.hero-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero-lv { font-size: 13px; font-weight: 600; opacity: .9; text-transform: uppercase; letter-spacing: .04em; }
.hero-name { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.xpbar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .25); overflow: hidden; }
.xpbar > i { display: block; height: 100%; background: #fff; border-radius: 4px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.hero-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; opacity: .92; font-variant-numeric: tabular-nums; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-round); font-weight: 700; font-size: 17px; color: var(--flame); }
.streak svg { width: 20px; height: 20px; }
.streak.is-off { color: var(--ink-3); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.week i { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: transparent; }
.week i svg { width: 16px; height: 16px; }
.week .is-done i { background: var(--flame); color: #fff; }
.week .is-today { color: var(--ink); }
.week .is-today:not(.is-done) i { box-shadow: inset 0 0 0 2px var(--flame); }
.next { display: flex; flex-direction: column; gap: 14px; }
.quest { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; }
.quest + .quest::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.6); }
.q-check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--fill-2); display: grid; place-items: center; color: transparent; flex: none; }
.q-check svg { width: 16px; height: 16px; }
.quest.is-done .q-check { background: var(--good-fill); border-color: var(--good-fill); color: #fff; }
.quest.is-done .item-title { color: var(--ink-3); }
.q-xp { font-family: var(--f-round); font-weight: 700; font-size: 14px; color: var(--tint-text); white-space: nowrap; }
.quest.is-done .q-xp { color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stat { background: var(--card); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stat span { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.stat b { font-family: var(--f-round); font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
.stat b small { font-size: 15px; font-weight: 600; color: var(--ink-3); margin-left: 3px; }
.stat em { font-style: normal; font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 3px; min-height: 17px; }
.stat em svg { width: 12px; height: 12px; }
.stat em.up { color: var(--good); } .stat em.down { color: var(--bad); }

/* ---- stars and badges ---- */
.stars { display: inline-flex; gap: 2px; color: var(--fill-2); }
.stars svg { width: 16px; height: 16px; }
.stars .on { color: var(--gold); }
.stars-lg svg { width: 44px; height: 44px; }
.stars-lg { gap: 6px; justify-content: center; }
.stars-lg .on { animation: starpop .5s cubic-bezier(.2, 1.6, .4, 1) backwards; }
.stars-lg .on:nth-child(2) { animation-delay: .18s; } .stars-lg .on:nth-child(3) { animation-delay: .36s; }
@keyframes starpop { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 520px) { .badges { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.badge { background: var(--card); border-radius: var(--r); padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.badge i { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-3); }
.badge i svg { width: 26px; height: 26px; }
.badge.is-got i { background: linear-gradient(145deg, #ffcf3f, #ff9500); color: #fff; box-shadow: 0 4px 12px rgba(255, 149, 0, .3); }
.badge b { font-size: 13px; font-weight: 600; line-height: 1.2; }
.badge span { font-size: 11px; color: var(--ink-3); line-height: 1.25; }
.badge:not(.is-got) b { color: var(--ink-3); }

/* ---- meters ---- */
.meter { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--tint); border-radius: 3px; min-width: 0; }
.meter.is-good > i { background: var(--good-fill); }
.progress { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--tint); }

/* ---- chart ---- */
.chart { position: relative; }
.chart > svg { width: 100%; height: auto; overflow: visible; }
.chart .bar-rect { fill: var(--tint); }
.chart .bar-hit { fill: transparent; }
.chart .bar-hit:hover + .bar-rect, .chart .bar-rect.is-on { filter: brightness(1.2); }
.chart .grid-line { stroke: var(--sep); stroke-width: 1; }
.chart .axis-text { fill: var(--ink-3); font-size: 11px; font-family: var(--f); font-variant-numeric: tabular-nums; }
.chart .val-text { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-family: var(--f); }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 12px; line-height: 1.3; white-space: nowrap; transform: translate(-50%, -100%); }
.tip b { font-size: 14px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--sep); }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
details > summary { cursor: pointer; color: var(--tint-text); font-size: 14px; list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
details > summary::-webkit-details-marker { display: none; }

/* ---- form controls ---- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--ink-3); padding-left: 4px; }
.input, .select, .textarea { width: 100%; min-height: 48px; border: 0; background: var(--card); border-radius: 12px; padding: 0 14px; font-size: 17px; -webkit-appearance: none; appearance: none; }
.sheet .input, .sheet .select, .sheet .textarea { background: var(--card); }
.select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.textarea { padding: 12px 14px; min-height: 180px; font-family: var(--f-mono); font-size: 13px; line-height: 1.35; resize: vertical; white-space: pre; overflow: auto; font-variant-ligatures: none; letter-spacing: 0; }
.input:focus, .select:focus, .textarea:focus { outline: 3px solid var(--tint-soft); box-shadow: inset 0 0 0 1.5px var(--tint); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fields-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.search { position: relative; min-width: 0; }
.search svg { position: absolute; left: 10px; top: 10px; width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
.search .input { padding-left: 34px; min-height: 38px; border-radius: 11px; background: var(--fill); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 10px; padding: 2px; gap: 0; }
.seg button { border: 0; background: transparent; min-height: 34px; border-radius: 8px; font-weight: 500; font-size: 14px; color: var(--ink); padding: 0 6px; transition: background .15s; }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 4px rgba(0, 0, 0, .14), 0 0 0 .5px rgba(0, 0, 0, .04); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #636366; } }
.seg button:disabled { opacity: .4; cursor: default; }
.stepper { display: inline-flex; align-items: center; border-radius: 10px; background: var(--fill); height: 36px; flex: none; }
.stepper button { width: 44px; height: 36px; border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--ink); }
.stepper output { min-width: 74px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; border-inline: .5px solid var(--sep); line-height: 22px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 17px; flex-direction: row-reverse; }
.toggle input { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); position: relative; flex: none; transition: background .2s; margin: 0; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .25); transition: transform .2s; }
.toggle input:checked { background: var(--good-fill); }
.toggle input:checked::after { transform: translateX(20px); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 17px; }

/* ---- the account on GitHub ---- */
.avatar { border-radius: 50%; flex: none; background: var(--fill); object-fit: cover; display: block; }
.avatar-none { display: inline-grid; place-items: center; color: var(--ink); }
.avatar-none svg { width: 58%; height: 58%; }
.step-n { width: 24px; height: 24px; border-radius: 50%; background: var(--tint); color: var(--tint-ink); display: inline-grid; place-items: center; font-family: var(--f-round); font-weight: 700; font-size: 14px; flex: none; }
.btn.btn-gh { background: var(--ink); color: var(--bg); }
.btn-gh svg:last-child { opacity: .6; }

/* ---- pictures: a drawn tile, with the artist's photograph over it where one is known ---- */
.art { --h: 250; position: relative; overflow: hidden; display: inline-grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 12px; color: #fff; background: linear-gradient(145deg, hsl(var(--h) 58% 54%), hsl(calc(var(--h) + 35) 60% 36%)); }
.art b { font-family: var(--f-round); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.art > svg { width: 52%; height: 52%; }
.art-game { background: linear-gradient(150deg, #1f8a5a, #0d4b3c); color: #ffd75e; }
.art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art-md { width: 64px; height: 64px; border-radius: 14px; } .art-md b { font-size: 20px; }
.art-lg { width: 60px; height: 60px; border-radius: 14px; } .art-lg b { font-size: 19px; }
.art-card { width: 100%; height: auto; aspect-ratio: 1; border-radius: 16px; } .art-card b { font-size: 30px; }
.art-banner { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; } .art-banner b { font-size: 56px; opacity: .9; } .art-banner > svg { width: 30%; height: 60%; }
.artists { display: flex; gap: 12px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
.artists::-webkit-scrollbar { display: none; }
.artist-card { flex: none; width: 132px; display: flex; flex-direction: column; gap: 5px; text-align: left; background: none; border: 0; padding: 0; color: inherit; scroll-snap-align: start; }
.artist-card > b { font-size: 15px; font-weight: 600; line-height: 1.2; margin-top: 3px; }
.artist-card > span:last-child { font-size: 13px; color: var(--ink-3); }
.artist-head { position: relative; height: 190px; border-radius: 22px; overflow: hidden; color: #fff; }
.artist-over { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 12px 16px 14px; background: linear-gradient(180deg, rgba(0, 0, 0, .3) 0%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .74) 100%); }
.btn.artist-back { background: rgba(0, 0, 0, .46); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding-left: 8px; }
/* ---- the path to a song ---- */
.pring { position: relative; width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center; }
.pring > svg:first-child { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.pring .track { fill: none; stroke: var(--fill-2); stroke-width: 4; }
.pring .arc { fill: none; stroke: var(--tint); stroke-width: 4; stroke-linecap: round; }
.pring b { font-family: var(--f-round); font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pring.is-done .arc { stroke: var(--gold); }
.pring.is-done > svg:last-child { width: 18px; height: 18px; color: var(--gold); position: relative; }
.path-num { display: flex; align-items: baseline; gap: 8px; }
.path-num b { font-family: var(--f-round); font-size: 34px; font-weight: 700; line-height: 1; }
.path-num span { color: var(--ink-3); font-size: 15px; }
.group-in { background: var(--fill); }
.step .q-check { width: 26px; height: 26px; }
.step .q-check svg { width: 14px; height: 14px; }
.step.is-done .q-check { background: var(--good-fill); border-color: var(--good-fill); color: #fff; }
.step.is-done .item-title { color: var(--ink-2); font-weight: 500; }
.step.is-next { background: var(--tint-soft); }
.step.is-next .q-check { border-color: var(--tint); }
.goal-song { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; color: inherit; width: 100%; }
.goal-flag svg { width: 14px; height: 14px; display: inline; vertical-align: -1px; color: var(--tint-text); }
.pill svg { flex: none; }
.notice-good { background: var(--good-soft); }
.notice-good > svg { color: var(--good); }
.unlock-big { background: linear-gradient(140deg, #ffcf3f, #ff9500); color: #1c1c1e; }
.unlock-big i { background: rgba(255, 255, 255, .4); color: #1c1c1e; }
.unlock-big .muted { color: rgba(0, 0, 0, .68); }
/* ---- metronome ---- */
.metro { background: var(--card); border-radius: 24px; padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.metro-dots { display: flex; justify-content: center; gap: 12px; min-height: 24px; align-items: center; }
.metro-dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--fill-2); transition: transform .07s, background .07s; }
.metro-dots i.is-one { box-shadow: inset 0 0 0 2.5px var(--tint); }
.metro-dots i.is-on { background: var(--tint); transform: scale(1.35); }
.metro-bpm { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.metro-bpm .icon-btn { width: 52px; height: 52px; font-size: 28px; line-height: 1; color: var(--ink); }
.metro-num { display: flex; flex-direction: column; align-items: center; }
.metro-num b { font-family: var(--f-round); font-size: 76px; font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; }
.metro-num span { font-size: 14px; color: var(--ink-3); font-weight: 500; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; margin: 0; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--fill-2); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .3); margin-top: -11px; }
.range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--fill-2); }
.range::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, .3); }

/* ---- sheets ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .4); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { width: 100%; max-width: 640px; max-height: 94%; overflow: auto; background: var(--sheet); --card: var(--sheet-card); border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; animation: rise .32s cubic-bezier(.2, .9, .3, 1); }
.sheet::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); align-self: center; flex: none; }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; max-height: 88%; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: rgba(40, 40, 44, .94); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 15px; font-weight: 500; max-width: calc(100% - 32px); text-align: center; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }

/* ---- tuner ---- */
.dial { position: relative; background: var(--card); border-radius: 24px; padding: 16px 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dial > svg { width: 100%; max-width: 420px; height: auto; }
.dial .tick { stroke: var(--ink-3); stroke-width: 1.5; opacity: .6; }
.dial .tick-major { stroke: var(--ink-2); stroke-width: 2; opacity: 1; }
.dial .zone { fill: var(--good-soft); }
.dial .zone.is-on { fill: var(--good-fill); }
.dial .needle { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; transition: transform .09s linear; transform-origin: 160px 170px; }
.dial .needle.is-idle { stroke: var(--fill-2); }
.dial .hub { fill: var(--ink); }
.dial .dial-text { fill: var(--ink-3); font-size: 11px; font-family: var(--f); font-weight: 600; letter-spacing: .04em; }
.readout { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: -18px; }
.readout .note-name { font-family: var(--f-round); font-weight: 700; font-size: 80px; line-height: .95; letter-spacing: -.02em; }
.readout .note-oct { font-family: var(--f-round); font-size: 22px; font-weight: 600; color: var(--ink-3); }
.readout-sub { font-size: 15px; color: var(--ink-2); min-height: 21px; text-align: center; font-variant-numeric: tabular-nums; }
.verdict { min-height: 28px; display: flex; justify-content: center; margin-top: 4px; }
.verdict .pill { height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; }
.strings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.string-btn { border: 0; background: var(--card); border-radius: 14px; padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 72px; }
.string-btn b { font-family: var(--f-round); font-weight: 700; font-size: 22px; line-height: 1; }
.string-btn small { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.string-btn i { display: block; width: 70%; background: var(--ink-3); border-radius: 2px; }
.string-btn[aria-pressed="true"] { background: var(--tint); color: #fff; }
.string-btn[aria-pressed="true"] i { background: #fff; } .string-btn[aria-pressed="true"] small { color: rgba(255, 255, 255, .8); }
.string-btn.is-tuned:not([aria-pressed="true"]) b { color: var(--good); }
.string-btn.is-tuned:not([aria-pressed="true"]) { box-shadow: inset 0 0 0 2px var(--good-fill); }

/* ---- song page ---- */
.shapes { display: flex; gap: 10px; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.shapes::-webkit-scrollbar { display: none; }
.shape { flex: none; width: 84px; background: var(--card); border: 0; border-radius: 14px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.shape:active { background: var(--fill); }
.shape b { font-family: var(--f-round); font-weight: 700; font-size: 17px; line-height: 1.1; }
.shape svg { width: 66px; height: 78px; }
.shape .fb-line { stroke: var(--ink-3); stroke-width: 1; }
.shape .fb-nut { stroke: var(--ink); stroke-width: 3; }
.shape .fb-dot { fill: var(--ink); }
.shape .fb-open { fill: none; stroke: var(--ink-2); stroke-width: 1.3; }
.shape .fb-x { stroke: var(--ink-3); stroke-width: 1.3; }
.shape .fb-text { fill: var(--ink-2); font-size: 8.5px; font-family: var(--f-mono); font-weight: 600; }
.shape small { font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); }
.best { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border-radius: var(--r); }
.best div { padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; position: relative; }
.best div + div::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: var(--sep); transform: scaleX(.6); }
.best span { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.best b { font-family: var(--f-round); font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cell { position: relative; min-height: 52px; background: var(--card); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px; font-family: var(--f-round); font-weight: 700; font-size: 19px; line-height: 1; text-align: center; overflow: hidden; }
.cell.is-two { font-size: 16px; }
.cell span { padding: 6px 2px; border-radius: 6px; min-width: 0; overflow-wrap: anywhere; }
.cell span.is-now { background: var(--tint); color: #fff; }
.cell span.is-hit { color: var(--good); }
.cell span.is-late { color: var(--adjust); }
.cell span.is-miss { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.cell span.is-rest { color: var(--ink-3); font-weight: 500; }
.cell.is-cur { box-shadow: inset 0 0 0 2px var(--tint); }
.tabsys { background: var(--card); border-radius: 14px; padding: 12px 14px; overflow-x: auto; scrollbar-width: thin; }
.tabsys pre { margin: 0; font-family: var(--f-mono); font-size: 13px; line-height: 1.32; color: var(--ink-3); white-space: pre; font-variant-ligatures: none; letter-spacing: 0; }
.tabsys .tl { color: var(--ink-2); font-weight: 600; }
.tabsys .tn { color: var(--ink); font-weight: 700; border-radius: 3px; }
.tabsys .tn.is-now { background: var(--tint); color: #fff; }
.tabsys .tn.is-hit { color: var(--good); }
.tabsys .tn.is-late { color: var(--adjust); }
.tabsys .tn.is-miss { color: var(--bad); background: var(--bad-soft); }
.drop { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--card); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--fill-2); border-top-color: var(--tint-text); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- results ---- */
.result-score { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.result-score b { font-family: var(--f-round); font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.result-score span { font-size: 13px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.result-big { font-family: var(--f-round); font-size: 34px; font-weight: 700; line-height: 1; }
.result-big small { font-size: 18px; color: var(--ink-3); font-weight: 600; }
.xp-card { background: linear-gradient(140deg, #4a3fd6, #8a4be0); color: #fff; border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.xp-card .spread b { font-family: var(--f-round); font-size: 22px; font-weight: 700; }
.xp-card .small { opacity: .9; }
.unlock { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r); padding: 12px 14px; }
.unlock i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #ffcf3f, #ff9500); color: #fff; flex: none; }
.unlock i svg { width: 22px; height: 22px; }
.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tally > div { background: var(--card); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tally span { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; font-weight: 500; }
.tally span svg { width: 13px; height: 13px; }
.tally b { font-family: var(--f-round); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.runs { display: flex; flex-wrap: wrap; gap: 4px; }
.runs i { font-style: normal; font-family: var(--f-mono); font-size: 11px; padding: 3px 6px; border-radius: 6px; background: var(--good-soft); color: var(--good); }
.runs i.w { background: var(--bad-soft); color: var(--bad); }
.runs i.m { background: var(--fill); color: var(--ink-3); text-decoration: line-through; }
.runs i.l { background: var(--adjust-soft); color: var(--adjust); }
.count-ring { font-family: var(--f-round); font-weight: 800; font-size: 104px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.pair b { font-family: var(--f-round); font-weight: 700; font-size: 40px; line-height: 1; padding: 16px 6px; border-radius: 18px; background: var(--card); overflow-wrap: anywhere; }
.pair b.is-now { background: var(--tint); color: #fff; }
.pair svg { width: 22px; height: 22px; color: var(--ink-3); }

/* ---- the stage ---- */
.stage { position: fixed; inset: 0; z-index: 50; background: #07060f; color: #fff; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; animation: fade .25s ease; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.st-top, .st-bottom { position: relative; z-index: 2; }
.st-top { padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0; display: flex; flex-direction: column; gap: 10px; }
.st-bar { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.st-x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; }
.st-x svg { width: 18px; height: 18px; }
.st-title { min-width: 0; display: flex; flex-direction: column; }
.st-title b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-title span { font-size: 12px; color: rgba(255, 255, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-score { text-align: right; line-height: 1; }
.st-score b { font-family: var(--f-round); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; }
.st-score span { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .65); }
.st-prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.st-prog .progress { background: rgba(255, 255, 255, .16); height: 5px; border-radius: 3px; }
.st-prog .progress > i { background: #fff; border-radius: 3px; transition: width .2s linear; }
.st-prog .stars { color: rgba(255, 255, 255, .25); }
.st-prog .stars svg { width: 18px; height: 18px; }
.st-prog .stars .on { color: #ffd60a; filter: drop-shadow(0 0 6px rgba(255, 214, 10, .7)); }

  function readDraft() {

  function askDraft() {
    draft.title = ($('#dTitle') || {}).value || ''; draft.artist = ($('#dArtist') || {}).value || '';

    if (!App.sample) { draft.err = 'Claude is not reachable from this view.'; refreshAdd(); return; }
    draft.busy = true; refreshAdd();
    var prompt = 'You are helping a guitar student add a song to a practice app.\n' +
      'Song title: ' + JSON.stringify(draft.title.trim().slice(0, 120)) + '\nArtist: ' + JSON.stringify(draft.artist.trim().slice(0, 120)) + '\n\n' +
      'Reply with only one JSON object and no other text, in this shape:\n' +
      '{"found": true, "title": "...", "artist": "...", "key": "E", "bpm": 85, "capo": 0, "level": 3, "confidence": "high", "note": "one practical playing tip, under 20 words",\n' +
      ' "sections": [{"name": "Verse", "bars": ["Emaj7", "C#m", "G#m", "B"], "repeat": 3}],\n' +
      ' "shapes": {"Emaj7": "x79897"}}\n\n' +
      'Rules:\n- Chords only. Never include lyrics or any words of the song.\n- One array item per bar. A bar with two chords is written "A B".\n' +
      '- Use the way guitarists most commonly play it. If that uses a capo, set "capo" and write chord names as the shapes played relative to the capo.\n' +
      '- "repeat" is how many times the section\'s bars repeat in a row. List sections in song order; repeat a section name when it returns.\n' +
      '- "shapes" maps a chord name to six fret characters from the low E string to the high E string, x for a muted string. Include it only for chords not played as the standard open shape. Use dashes between frets if any fret is above 9.\n' +
      '- "level" is 1 (a few open chords) to 5 (advanced). "confidence" is high, medium or low.\n' +
      '- If you do not know this song\'s chords well, reply {"found": false} instead of guessing.';
    App.sample.json(prompt, { cache: { gcTime: 3600000 } }).then(function (res) {
      draft.busy = false;
      if (!res || res.found === false || !Array.isArray(res.sections)) { draft.err = 'Claude does not know this song well enough to draft it. Paste a tab instead, or ask in the chat so it can look the song up.'; refreshAdd(); return; }
      var sections = [];
      res.sections.forEach(function (sec) {
        if (!sec || !Array.isArray(sec.bars)) return;
        var bars = sec.bars.map(function (b) { return String(b || '').trim(); }).filter(function (b) {
          var toks = M.splitBar(b); return toks.length > 0 && toks.length <= 4 && toks.every(function (t) { return !!M.parseChord(t); });

      });
      if (!sections.length) { draft.err = 'The draft came back without usable chords. Try again, or paste a tab.'; refreshAdd(); return; }
      var shapes = [];
      if (res.shapes && typeof res.shapes === 'object') Object.keys(res.shapes).slice(0, 30).forEach(function (k) { if (M.parseChord(k) && M.parseShape(String(res.shapes[k]))) shapes.push({ n: k, s: String(res.shapes[k]) }); });
      var bpm = parseInt(res.bpm, 10);

        title: String(res.title || draft.title).slice(0, 120), artist: String(res.artist || draft.artist).slice(0, 120),
        sections: sections.slice(0, 24), shapes: shapes, capo: App.clamp(parseInt(res.capo, 10) || 0, 0, 12), bpm: bpm >= 30 && bpm <= 260 ? bpm : null, tuning: 'standard',
        key: String(res.key || '').slice(0, 8), note: String(res.note || '').slice(0, 160), origin: 'draft', checked: false, confidence: String(res.confidence || '').slice(0, 10)

    var d = App.addSong.draft(); if (!d) return;
    if ($('#dTitle')) d.title = $('#dTitle').value; if ($('#dArtist')) d.artist = $('#dArtist').value; if ($('#dText')) d.text = $('#dText').value;
  }
  var inputs = {
    q: function (el) { S.filter.q = el.value; App.render(true); },
    dtitle: function (el) { var d = App.addSong.draft(); d.title = el.value; var fb = $('#findBox'); if (fb) fb.innerHTML = App.addSong.findBoxHtml((d.title + ' ' + d.artist).trim()); },
    dartist: function (el) { var d = App.addSong.draft(); d.artist = el.value; var fb = $('#findBox'); if (fb) fb.innerHTML = App.addSong.findBoxHtml((d.title + ' ' + d.artist).trim()); },
    dtext: function (el) { App.addSong.draft().text = el.value; },
    tuning: function (el) { S.settings.tuning = el.value; T.sel = -1; T.tuned = {}; App.Store.saveSettings(); App.render(true); },
    'p-section': function (el) { if (!P.st || P.st.run) return; P.st.section = parseInt(el.value, 10); P.st.marks = {}; App.render(true); },
    'p-loop': function (el) { if (P.st) P.st.loop = !!el.checked; },
    'set-click': function (el) { S.settings.click = !!el.checked; App.Store.saveSettings(); },
    'set-guide': function (el) { S.settings.guide = !!el.checked; App.Store.saveSettings(); },
    'set-countin': function (el) { S.settings.countIn = !!el.checked; App.Store.saveSettings(); },
    'set-tones': function (el) { S.settings.tones = !!el.checked; App.Store.saveSettings(); },
    'met-bpm': function (el) { App.met.set(parseInt(el.value, 10) || 90); },
    'met-accent': function (el) { App.met.accent = !!el.checked; App.met.set(App.met.bpm); var d = $('#mDots'); if (d && d.firstChild) d.firstChild.classList.toggle('is-one', App.met.accent); }
  };

  App.boot = function () {
    document.addEventListener('click', function (ev) {
      var t = ev.target;
      if (t && t.id === 'sheet') { App.sheet.close(); return; }
      var el = t && t.closest ? t.closest('[data-act]') : null;
      if (!el || el.disabled) return;
      var fn = actions[el.getAttribute('data-act')];
      if (fn) { A.ensure(); fn(el, ev); }
    });
    function onInput(ev) {
      var el = ev.target;
      if (!el || !el.getAttribute) return;
      var file = el.getAttribute('data-file');
      if (file && ev.type === 'change') {
        var f = el.files && el.files[0];
        try { el.value = ''; } catch (e) { /* ignore */ }
        if (!f) return;
        A.ensure();
        if (file === 'take') P.takeFile(f); else T.clipFile(f);
        return;
      }
      var key = el.getAttribute('data-in');
      if (!key || !inputs[key]) return;
      var isText = el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search' || el.type === 'range' || !el.type) || el.tagName === 'TEXTAREA';
      if (isText ? ev.type === 'input' : ev.type === 'change') inputs[key](el);
    }
    document.addEventListener('input', onInput);
    document.addEventListener('change', onInput);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && App.sheet.isOpen()) App.sheet.close();
      if (ev.key === 'Enter' && ev.target && ev.target.id === 'ghKey') actions['acct-in']();
    });
    /* a picture that does not load leaves the drawn tile underneath showing */
    document.addEventListener('error', function (ev) { var el = ev.target; if (el && el.tagName === 'IMG' && el.classList && el.classList.contains('art-img')) App.artFailed(el); }, true);
    document.addEventListener('focusin', function (ev) { var el = ev.target; if (el && el.hasAttribute && el.hasAttribute('data-select')) { try { el.select(); } catch (e) { /* ignore */ } } });
    /* anything that goes wrong on a device nobody can look at ends up in the technical log */
    var errs = 0;
    root.addEventListener('error', function (ev) { if (errs++ < 5) App.diag.add('error', (ev && ev.message ? ev.message : 'error') + (ev && ev.lineno ? ' @' + ev.lineno + ':' + ev.colno : '')); });
    root.addEventListener('unhandledrejection', function (ev) { var r = ev && ev.reason; if (errs++ < 5) App.diag.add('error', 'promise: ' + (r && (r.message || r.code || r.name) ? (r.name ? r.name + ' ' : '') + (r.message || r.code || '') : String(r))); });
    root.addEventListener('hashchange', function () {
      var h = (root.location.hash || '').replace('#', '');
      if ((h === 'today' || h === 'songs' || h === 'tuner' || h === 'me') && h !== S.route.name) App.go({ name: h });
    });
    var rz = null;
    root.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (S.route.name === 'me' && !App.sheet.isOpen()) App.render(); }, 180); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && T.on) { T.stop(); App.render(true); }
      if (document.hidden && App.met.on) { App.met.stop(true); App.render(true); }
    });
    A.probe();
    var h = (root.location.hash || '').replace('#', '');
    if (h === 'songs' || h === 'tuner' || h === 'me') S.route = { name: h };
    App.addSong.reset();
    var opened = function () {
      var m = S.mic;
      var where = '';
      try { where = root.location.protocol + '//' + root.location.host + (root.location.search ? ' ?' + root.location.search.length : '') + ', origin ' + (root.origin === 'null' ? 'opaque' : 'own'); } catch (e) { where = 'address unknown'; }
      App.diag.add('open', (m.framed ? 'framed' : 'own page') + ' at ' + where + ', data ' + S.store + ', microphone ' + (m.pre === 'blocked' ? 'blocked (' + m.why + ')' : m.pre) + ', policy ' + (m.policy === null ? 'unknown' : m.policy) + ', browser permission ' + (m.perm || 'unknown') + ', ' + (root.isSecureContext === false ? 'not secure' : 'secure') + ', storage ' + App.diag.kept + ', account ' + (App.acct.offered ? (App.acct.token ? 'signed in' : 'signed out') : 'not offered'));
    };
    /* only once the page knows whether it has a database can it tell whether the GitHub account applies */
    var ready = function () { App.acct.init(); opened(); App.render(); };
    App.Store.init().then(ready, ready);
    App.render(true);
  };
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.boot); else App.boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
